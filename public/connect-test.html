<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>MetaMask Connection Test</title>
<style>
  body { background: #050506; color: #f2f2f5; font-family: Inter, sans-serif; padding: 2rem; max-width: 640px; margin: 0 auto; }
  h1 { font-size: 22px; }
  .card { background: #121318; border: 1px solid rgba(255,255,255,0.12); border-radius: 14px; padding: 1.2rem; margin-top: 1rem; }
  .card h3 { margin: 0 0 8px; font-size: 14px; }
  .mono { font-family: 'DM Mono', monospace; font-size: 13px; color: #9a9aa6; word-break: break-all; }
  button { margin-top: 10px; padding: 10px 16px; border: none; border-radius: 10px; background: linear-gradient(135deg,#00e5a0,#6B8BFF); color: #000; font-weight: 700; font-size: 13px; cursor: pointer; }
  .ok { color: #34d399; } .bad { color: #f87171; }
</style>
</head>
<body>
  <h1>MetaMask Connection Test</h1>

  <div class="card">
    <h3>Detected wallets</h3>
    <div id="detect" class="mono">Checking…</div>
  </div>

  <div class="card">
    <h3>Direct connection (no libraries)</h3>
    <div id="result" class="mono">Not tested</div>
    <button onclick="doConnect()">Request accounts directly</button>
  </div>

  <div class="card">
    <h3>Switch to Arc Testnet (5042002)</h3>
    <div id="switchresult" class="mono">Not tested</div>
    <button onclick="doSwitch()">Switch to Arc</button>
  </div>

<script>
  const ARC_CHAIN = {
    chainId: '0x4cef52',
    chainName: 'Arc Testnet',
    nativeCurrency: { name: 'USDC', symbol: 'USDC', decimals: 18 },
    rpcUrls: ['https://arcfx-app.vercel.app/api/rpc'],
    blockExplorerUrls: ['https://testnet.arcscan.app'],
  }

  function el(id) { return document.getElementById(id) }

  function detect() {
    const e = window.ethereum
    if (!e) { el('detect').innerHTML = '<span class="bad">No window.ethereum found</span>'; return }
    const parts = [
      'isMetaMask: ' + !!e.isMetaMask,
      'isOKX: ' + !!e.isOKXWallet,
      'isRabby: ' + !!e.isRabby,
      'isCoinbase: ' + !!e.isCoinbaseWallet,
      'chainId: ' + (e.chainId || 'unknown'),
      'provider name: ' + (e._state?.isConnected === undefined ? '?' : e._state.isConnected),
    ]
    el('detect').innerHTML = parts.join('<br>')
  }

  async function doConnect() {
    const e = window.ethereum
    if (!e) { el('result').innerHTML = '<span class="bad">No window.ethereum</span>'; return }
    try {
      const accounts = await e.request({ method: 'eth_requestAccounts' })
      el('result').innerHTML = '<span class="ok">Connected: </span>' + (accounts[0] || 'none')
    } catch (err) {
      el('result').innerHTML = '<span class="bad">Error: </span>' + (err.message || err.code || err)
    }
  }

  async function doSwitch() {
    const e = window.ethereum
    if (!e) { el('switchresult').innerHTML = '<span class="bad">No window.ethereum</span>'; return }
    try {
      await e.request({ method: 'wallet_switchEthereumChain', params: [{ chainId: ARC_CHAIN.chainId }] })
      el('switchresult').innerHTML = '<span class="ok">Switched to Arc (or already on it)</span>'
    } catch (err) {
      if (err.code === 4902) {
        try {
          await e.request({ method: 'wallet_addEthereumChain', params: [ARC_CHAIN] })
          el('switchresult').innerHTML = '<span class="ok">Network added and switched</span>'
        } catch (err2) {
          el('switchresult').innerHTML = '<span class="bad">addEthereumChain error: </span>' + (err2.message || err2)
        }
      } else {
        el('switchresult').innerHTML = '<span class="bad">switch error: </span>' + (err.message || err)
      }
    }
  }

  detect()
  window.addEventListener('ethereum#initialized', detect)
</script>
</body>
</html>
